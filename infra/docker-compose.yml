services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_PATH=/data/clinic-queue.sqlite
      - SCHEMA_PATH=/app/docs/schema.sqlite.sql
      - AUTO_SEED=true
      - SEED_CLINIC_ID=00000000-0000-4000-8000-000000000001
      - SEED_ROOM_1_ID=00000000-0000-4000-8000-000000000101
      - SEED_ROOM_2_ID=00000000-0000-4000-8000-000000000102
      - ADMIN_PASSWORD=admin1234
      - STAFF_PASSWORD=staff1234
    volumes:
      - ./data:/data
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
      - NEXT_PUBLIC_CLINIC_ID=00000000-0000-4000-8000-000000000001
    depends_on:
      - api
    restart: unless-stopped

  display:
    build:
      context: ..
      dockerfile: apps/display/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
      - NEXT_PUBLIC_CLINIC_ID=00000000-0000-4000-8000-000000000001
    depends_on:
      - api
    restart: unless-stopped
